[project]
name = "clasificador"
version = "0.1.0"
description = "Ingesta y estructuración de conversaciones de WhatsApp (CDR) hacia MySQL"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "mysql-connector-python>=8.0",
    "python-dotenv>=1.0",
    "Flask>=3.0",
    "Authlib>=1.3",
    "requests>=2.31",
    "openai>=1.40",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "openapi-spec-validator>=0.7",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clasificador.webapp" = ["openapi.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mysql: end-to-end tests that need a MySQL server (set MYSQL_TEST_URL)"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108", "SIM103", "SIM105", "B905", "UP042"]
